[package]
name = "launcher"
version = "0.3.4"
edition = "2021"
description = "Custom Minecraft launcher"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "process", "io-util", "macros", "rt-multi-thread", "time", "sync", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md5 = "0.7"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
semver = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# Нативні діалоги вибору папки / .zip (IFileOpenDialog) замість дочірнього powershell.exe.
# Та сама версія, що вже є в дереві залежностей Tauri (wry, webview2-com), — нових завантажень немає.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
